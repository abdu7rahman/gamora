arm:
  # ROS 1 used cached_ik_kinematics_plugin/CachedKDLKinematicsPlugin. The cached
  # IK plugin is not part of a standard MoveIt 2 install, so this falls back to
  # plain KDL. Swap in kinematics_solver: pick_ik/PickIkPlugin if you want
  # something faster and have it built.
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.005
  goal_joint_tolerance: 0.0001
  goal_position_tolerance: 0.0001
  goal_orientation_tolerance: 0.001
